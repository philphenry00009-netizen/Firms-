# .github/workflows/build.yml
name: Build Firms APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      ## 1️⃣ Checkout the repo
      - uses: actions/checkout@v4

      ## 2️⃣ Locate the ZIP, unzip it, and remember the project folder
      - name: Find and unzip project
        run: |
          ZIP=$(find . -maxdepth 3 -iname '*.zip' | head -n1)
          echo "Using zip: $ZIP"
          unzip -o -q "$ZIP" -d unpacked
          # The Android project is where settings.gradle* lives
          SETTINGS=$(find unpacked -name settings.gradle* | head -n1)
          echo "PROJECT_DIR=$(dirname \"$SETTINGS\")" >> "$GITHUB_ENV"

      ## 3️⃣ Patch the Kotlin compile‑error automatically
      - name: Apply Kotlin compile‑fix
        run: |
          find unpacked -name MainActivity.kt -exec sed -i 's/apertures\.indexOf(/apertures.toList().indexOf(/g' {} +

      ## 4️⃣ Rename the app to “Firms”
      - name: Update app name
        run: |
          STRINGS_FILE=$(find unpacked -name strings.xml | grep "src/main/res/values/strings.xml" | head -n1)
          if [ -n "$STRINGS_FILE" ]; then
            echo "Renaming app name in $STRINGS_FILE"
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Firms<\/string>/g' "$STRINGS_FILE"
          fi

      ## 5️⃣ Install Java (Temurin) – required for Gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      ## 6️⃣ Accept Android SDK licences (silent)
      - name: Accept Android licences
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      ## 7️⃣ Set up Gradle 8.7
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      ## 8️⃣ Compile the APK
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      ## 9️⃣ Rename the generated APK to a friendly name
      - name: Rename APK
        run: |
          OLD_APK=$(find unpacked -type f -name '*-debug.apk' | head -n1)
          echo "Found APK: $OLD_APK"
          mv "$OLD_APK" "${{ env.PROJECT_DIR }}/Firms.apk"
          ls -lh "${{ env.PROJECT_DIR }}/Firms.apk"

      ## 🔁 Upload the finished APK as a GitHub Action artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firms-apk
          path: ${{ env.PROJECT_DIR }}/Firms.apk
