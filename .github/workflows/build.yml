name: Build Firms APK

# Runs on push to main or when you hit “Run workflow”
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ----------------------------------------------------------------------
      # 1️⃣ Checkout the repo
      # ----------------------------------------------------------------------
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------------
      # 2️⃣ Find the ZIP file, unzip it, and note the Android‑project root
      # ----------------------------------------------------------------------
      - name: Find and unzip project
        run: |
          ZIP=$(find . -maxdepth 3 -iname '*.zip' | head -n1)
          echo "Using zip: $ZIP"
          unzip -o -q "$ZIP" -d unpacked
          # The Android project is where settings.gradle* lives
          SETTINGS=$(find unpacked -name settings.gradle* | head -n1)
          echo "PROJECT_DIR=$(dirname \"$SETTINGS\")" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # 3️⃣ Automatically patch every Kotlin file that tries to call indexOf()
      # ----------------------------------------------------------------------
      - name: Apply Kotlin compile‑fix
        run: |
          # Replace every →  apertures.indexOf(X) → apertures.toList().indexOf(X)
          find unpacked -name '*.kt' -exec \
            sed -i 's/apertures\.indexOf(/apertures.toList().indexOf(/g' {} +
          # Quick sanity check – there should be no bare "apertures.indexOf"
          grep -R "apertures\.indexOf" -n unpacked || echo "Patch applied – no raw indexOf left."

      # ----------------------------------------------------------------------
      # 4️⃣ Rename the display name to “Firms”
      # ----------------------------------------------------------------------
      - name: Update app name
        run: |
          STRINGS_FILE=$(find unpacked -name strings.xml | grep "src/main/res/values/strings.xml" | head -n1)
          if [ -n "$STRINGS_FILE" ]; then
            echo "Renaming app name in $STRINGS_FILE"
            sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">Firms<\/string>/g' "$STRINGS_FILE"
          fi

      # ----------------------------------------------------------------------
      # 5️⃣ Java (Temurin 17) – needed for Gradle
      # ----------------------------------------------------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ----------------------------------------------------------------------
      # 6️⃣ Accept Android licences in silen‑t mode
      # ----------------------------------------------------------------------
      - name: Accept Android licences
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # ----------------------------------------------------------------------
      # 7️⃣ Gradle 8.7 – build tool for Android
      # ----------------------------------------------------------------------
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ----------------------------------------------------------------------
      # 8️⃣ Compile the APK (debug variant)
      # ----------------------------------------------------------------------
      - name: Build APK
        run: gradle -p "$PROJECT_DIR" --no-daemon assembleDebug

      # ----------------------------------------------------------------------
      # 9️⃣ Rename the generated APK to a friendly name
      # ----------------------------------------------------------------------
      - name: Rename APK
        run: |
          OLD_APK=$(find unpacked -type f -name '*-debug.apk' | head -n1)
          echo "Found APK: $OLD_APK"
          mv "$OLD_APK" "${{ env.PROJECT_DIR }}/Firms.apk"
          ls -lh "${{ env.PROJECT_DIR }}/Firms.apk"

      # ----------------------------------------------------------------------
      # 10️⃣ Upload final APK as a workflow artifact
      # ----------------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Firms-apk
          path: ${{ env.PRODUCT_DIR }}/Firms.apk   # <-- typo fixed
